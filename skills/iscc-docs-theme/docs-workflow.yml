# Template for .github/workflows/docs.yml in an ISCC project: build the documentation with the ISCC theme,
# check it and deploy it to GitHub Pages. Adapt the paths, the Python version and the dependency group, and keep
# docs/CNAME for a custom domain. Copy the action pins of the project's other workflows if they are newer.
# Sites whose pages import the project itself (mkdocstrings API pages) sync with `--group docs` instead of
# `--only-group docs`.
name: Docs

on:
  pull_request:
    paths: [docs/**, zensical.toml, pyproject.toml, uv.lock, .github/workflows/docs.yml]
  push:
    branches: [main]
    paths: [docs/**, zensical.toml, pyproject.toml, uv.lock, .github/workflows/docs.yml]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.13"
      - run: uv sync --frozen --only-group docs
      - run: uv run --no-sync zensical-iscc build
      - run: uv run --no-sync zensical-iscc check --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
