# Configuration of theme.iscc.codes, the documentation of the theme. It is also the
# reference configuration for all ISCC documentation sites on the zensical-iscc theme.
#
# To start a site, copy this file and replace the values marked "site". All other values
# are the shared ISCC setup. Change them only if the site has a clear reason.
# `zensical-iscc check` reports changes that break the theme or its privacy rules.

[project]
site_name = "ISCC Theme"                                              # site
site_description = "Zensical theme, command and agent skills for ISCC documentation sites" # site
site_author = "Titusz Pan"                                            # site
site_url = "https://theme.iscc.codes/"                                # site
repo_url = "https://github.com/iscc/zensical-iscc"                    # site
repo_name = "iscc/zensical-iscc"                                      # site
edit_uri = "edit/main/docs/"                                          # site: branch and docs path
copyright = "Copyright © 2026 The Authors"                         # site: years; the theme adds the ISCC links

# Each page sets its navigation icon with `icon: lucide/<name>` in its front matter.
# The last page in the navigation is "For Coding Agents".
nav = [                                                               # site
    { "Home" = "index.md" },
    { "Get started" = "get-started.md" },
    { "Configuration" = "configuration.md" },
    { "Writing pages" = "writing.md" },
    { "Components" = "components.md" },
    { "Command line" = "command-line.md" },
    { "Design" = "design.md" },
    { "Development" = "development.md" },
    { "Changelog" = "changelog.md" },
    { "For Coding Agents" = "for-coding-agents.md" },
]

# Options for main.html of the theme. Plausible analytics are on by default. They count the
# site under the host name of site_url. `[project.extra.analytics] domain` sets a different host.
[project.extra.iscc]
tagline = "Zensical theme for ISCC documentation" # site: home page title suffix
copy_page = true                                  # "Copy page" button; needs `zensical-iscc build`
chat = false                                      # iscc.ai chat widget; only on origins iscc.ai allows
project = "theme"                                 # site: name in the project logo; default: repo_name without iscc-

# Related ISCC sites for the "Projects" menu in the header, in display order. List the sites
# that your readers go to, the specification and the site itself. The entry that links to
# site_url gets the marker for the current site. Without entries, the site has no menu.
[[project.extra.iscc.related]]                                        # site
name = "ISCC Theme"
link = "https://theme.iscc.codes/"
description = "Theme and tooling for ISCC documentation sites"

[[project.extra.iscc.related]]                                        # site
name = "ISCC Specification"
link = "https://iscc.codes/"
description = "The International Standard Content Code, ISO 24138"

[[project.extra.iscc.related]]                                        # site
name = "ISCC Search"
link = "https://search.iscc.codes/"
description = "Similarity search engine for ISCC codes"

[[project.extra.iscc.related]]                                        # site
name = "ISCC Web"
link = "https://web.iscc.codes/"
description = "Service that generates ISCC codes for media files"

[[project.extra.iscc.related]]                                        # site
name = "ISCC Monitor"
link = "https://monitor.iscc.codes/"
description = "Verifies and mirrors the transparency logs of ISCC hubs"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/iscc/zensical-iscc" # site

# The theme supplies the fonts, palette, logo, favicon and default features.
# Put templates for this site only into a `custom_dir` next to this setting.
[project.theme]
name = "zensical_iscc"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx]
details = {}

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
