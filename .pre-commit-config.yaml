# Git hooks, run by prek (https://github.com/j178/prek): `uv run prek install` once, then on every commit.
# `uv run prek run --all-files` checks the whole tree. CI runs the same hooks.
# Brand assets and GLightbox stay byte-identical to their sources (brand kit, iscc-io, GLightbox release).
exclude: ^zensical_iscc/theme/assets/iscc/((tokens|fonts|logos|vendor)/|.*\.(svg|png|ico)$)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: fix-byte-order-marker
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^uv\.lock$
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        files: ^(README|CLAUDE)\.md$|^skills/.*\.md$
        additional_dependencies:
          - "mdformat-mkdocs[recommended]>=5.3.0"

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.23
    hooks:
      - id: uv-lock

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
